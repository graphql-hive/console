on:
  workflow_call:
    inputs:
      registry:
        default: ghcr.io
        type: string
      imageName:
        default: ${{ github.repository_owner }}
        type: string
      imageTag:
        required: true
        type: string
      buildImagesLocally:
        default: false
        type: boolean

jobs:
  e2e:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}/${{ inputs.imageName }}/
      DOCKER_TAG: :${{ inputs.imageTag }}
      HIVE_APP_BASE_URL: 'http://localhost:8080'

    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: setup environment
        uses: ./.github/actions/setup
        with:
          codegen: true
          actor: test-e2e

      - name: build packages and applications
        if: ${{ inputs.buildImagesLocally }}
        run: pnpm build

      - name: configure Docker Node.js image tag
        id: node-version-tag
        if: ${{ inputs.buildImagesLocally }}
        run: echo "value=:$(< .node-version)-slim" >> "$GITHUB_OUTPUT"

      - name: configure Docker buildx
        if: ${{ inputs.buildImagesLocally }}
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: build local Docker images
        if: ${{ inputs.buildImagesLocally }}
        env:
          COMMIT_SHA: ${{ inputs.imageTag }}
          RELEASE: ${{ inputs.imageTag }}
          BRANCH_NAME: external-pr
          BUILD_TYPE: ''
          DOCKER_REGISTRY: ''
          DOCKER_TAG: :${{ inputs.imageTag }}
          NODE_VERSION_TAG: ${{ steps.node-version-tag.outputs.value }}
        run: |
          echo "DOCKER_REGISTRY=" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=:${{ inputs.imageTag }}" >> "$GITHUB_ENV"
          docker buildx bake -f docker/docker.hcl build --load

      - name: install playwright browsers
        timeout-minutes: 15
        run: pnpm exec playwright install chromium --with-deps

      - name: patch compose file volumes
        uses: mikefarah/yq@4839dbbf80445070a31c7a9c1055da527db2d5ee # v4.44.6
        with:
          cmd: yq -i 'del(.services.*.volumes)' docker/docker-compose.community.yml

      - name: run containers
        timeout-minutes: 10
        run: |
          docker compose \
            --env-file integration-tests/.env \
            -f docker/docker-compose.community.yml \
            -f docker/docker-compose.end2end.yml \
            up -d --wait

      - name: playwright
        timeout-minutes: 20
        run: pnpm test:e2e
        env:
          CI: true

      - name: troubleshoot containers
        if: ${{ failure() }}
        run: |
          docker --version
          docker ps --format json | jq .
          docker compose \
            --env-file integration-tests/.env \
            -f docker/docker-compose.community.yml \
            -f docker/docker-compose.end2end.yml \
            logs

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ failure() && !inputs.buildImagesLocally }}
        with:
          name: playwright
          path: |
            ./playwright-report/**/*
            ./test-results/**/*
