on:
  workflow_call:
    inputs:
      registry:
        default: ghcr.io
        type: string
      imageName:
        default: ${{ github.repository_owner }}
        type: string
      imageTag:
        required: true
        type: string
      loadImagesFromArtifact:
        description:
          Load the images from the "docker-images" workflow artifact instead of pulling them from
          the registry.
        default: false
        type: boolean

jobs:
  e2e:
    runs-on: ubuntu-22.04

    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}/${{ inputs.imageName }}/
      DOCKER_TAG: :${{ inputs.imageTag }}
      HIVE_APP_BASE_URL: 'http://localhost:8080'

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: download docker images artifact
        if: ${{ inputs.loadImagesFromArtifact }}
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: docker-images
          path: ${{ runner.temp }}/docker-images

      - name: load docker images
        if: ${{ inputs.loadImagesFromArtifact }}
        env:
          IMAGES_DIR: ${{ runner.temp }}/docker-images
        run: |
          docker load -i "$IMAGES_DIR/docker-images.tar.gz"
          rm -rf "$IMAGES_DIR"

      - name: setup environment
        uses: ./.github/actions/setup
        with:
          codegen: true
          actor: test-e2e

      - name: build workspace dependencies
        run: pnpm turbo build --filter=@graphql-hive/core --filter=@graphql-hive/yoga

      - name: install playwright browsers
        timeout-minutes: 15
        run: pnpm exec playwright install chromium --with-deps

      - name: patch compose file volumes
        uses: mikefarah/yq@4839dbbf80445070a31c7a9c1055da527db2d5ee # v4.44.6
        with:
          cmd: yq -i 'del(.services.*.volumes)' docker/docker-compose.community.yml

      - name: run containers
        timeout-minutes: 10
        run: |
          docker compose \
            --env-file integration-tests/.env \
            -f docker/docker-compose.community.yml \
            -f docker/docker-compose.end2end.yml \
            up -d --wait

      - name: playwright
        timeout-minutes: 20
        run: pnpm test:e2e
        env:
          CI: true

      - name: troubleshoot containers
        if: ${{ failure() }}
        run: |
          docker --version
          docker ps --format json | jq .
          docker compose \
            --env-file integration-tests/.env \
            -f docker/docker-compose.community.yml \
            -f docker/docker-compose.end2end.yml \
            logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright
          path: |
            ./playwright-report/**/*
            ./test-results/**/*
