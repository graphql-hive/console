on:
  workflow_call:
    secrets:
      hiveToken:

jobs:
  search-token:
    runs-on: ubuntu-22.04
    outputs:
      hive_token_present: ${{ steps.secrets_present.outputs.hive_token }}
    steps:
      - name: check for Hive token presence
        env:
          HIVE_TOKEN: ${{ secrets.hiveToken }}
        id: secrets_present
        run: echo "hive_token=${{ env.HIVE_TOKEN != '' }}" >> $GITHUB_OUTPUT

  check:
    runs-on: ubuntu-22.04
    needs: search-token
    if: needs.search-token.outputs.hive_token_present == 'true'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: setup environment
        uses: ./.github/actions/setup
        with:
          actor: graphql-schema-check

      - name: check pull request label
        if: contains(github.event.pull_request.labels.*.name, 'non-breaking')
        run: echo "safeFlag=--forceSafe" >> $GITHUB_OUTPUT
        id: pr-label-check

      - name: schema check
        env:
          HIVE_TOKEN: ${{ secrets.hiveToken }}
          HIVE_CLI_VERSION: 0.68.7
          HIVE_CLI_SHA256: fb783f292b1de4b26be0de5af84a0da5609e6f68eb0e0309c85320fd56bb523d
        run: |
          set -euo pipefail
          archive="hive-v${HIVE_CLI_VERSION}-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/graphql-hive/console/releases/download/%40graphql-hive%2Fcli%40${HIVE_CLI_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$HIVE_CLI_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive"
          node ./hive/bin/run schema:check "schema.graphql" ${{steps.pr-label-check.outputs.safeFlag }} \
            --service "graphql"
